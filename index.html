return s}
function render(){
if(rl())buildR();const th=+$('#th').value,cu=th<70,rows=SC[$('#sc').value];$('#tv').textContent=th+'%';{const q=rl()?sel():DT;$('#dt').textContent=q?q.replace(/-/g,'/'):'日期未提供';$('#na').textContent=rl()?'真實數據':'模擬數據'};
const ok=[],bad=[];
rows.forEach(r=>{const[c,n,u,f,d,ft]=r;
if([u,f,d].some(x=>typeof x!=='number'||isNaN(x))||Math.abs(u+f+d-100)>1.0000001)bad.push(r);else ok.push({c,n,u,f,d,ft})});
const hit=ok.filter(x=>x.u>=th).sort((a,b)=>b.u-a.u||a.d-b.d),N=hit.length;cur=hit.slice(0,5);
const lab=cu?'自訂門檻觀察股':'高勝率突破觀察股';
let h=`<h2>台股盤後選股報告｜${dth()}${rl()?'':'｜（模擬數據）'}${cu?`｜門檻 ${th}%（非預設）`:''}</h2>`;
bad.forEach(r=>{h+=`<p class="warn">⚠ 資料異常：${r[0]}${r[1]} 三個機率加總為 ${+(r[2]+r[3]+r[4]).toFixed(1)}%，未修正、未納入篩選</p>`});
if(!N){h+=`<div class="zero">${cu?'今日無符合自訂門檻的股票':'今日無高勝率股'}</div>`}
else{
if(N>5)h+=`<p class="cnt">本日符合共 ${N} 檔，僅列前 5 檔</p>`;
h+=`<div class="tw"><table><thead><tr><th>排名</th><th>代號名稱</th><th>上漲／盤整／下跌</th><th>上漲／下跌比</th><th>勝率優勢</th><th>星等</th></tr></thead><tbody>`;
cur.forEach((x,i)=>{const s=star(x.u);
h+=`<tr data-i="${i}" tabindex="0"><td>${i+1}</td><td><b>${x.c}</b> ${x.n}</td><td data-label="上漲／盤整／下跌"><span class="u">${F(x.u)}</span> / ${F(x.f)} / <span class="d">${F(x.d)}</span></td><td data-label="上漲／下跌比">${x.d===0?'無下跌機率':(x.u/x.d).toFixed(1)}</td><td data-label="勝率優勢">${SG(x.u-x.d)} 百分點</td><td class="st${s?'':' ns'}">${s?'★'.repeat(s):'不計星'}</td></tr>`});
h+=`</tbody></table></div><p class="cv">上漲／下跌比、勝率優勢、星等為換算指標，非機器人輸出${cur.some(x=>star(x.u)===0)?'；星等僅對上漲訊號機率 70% 以上計算，未達者標示「不計星」':''}</p><p class="tip">點選任一檔，查看個股明細</p><blockquote><small>白話重點</small>${say(cur,th)}</blockquote>`}
h+=`<p class="end">入選股請自行再查：①法人動向 ②均線位置</p><p class="end">查完有共識的股票，可分享到群組</p><p class="fine">機器人預測僅供參考，非投資建議。</p>`;
$('#rep').innerHTML=h;$('#hint').textContent=N?'':'目前沒有股票達到門檻。可拖動上方的「門檻」滑桿，調低看看。';chips();closeP()}
const SV=x=>`<svg viewBox="0 0 300 80" width="100%" style="background:#F7F9FB;border-radius:8px">${x}</svg>`;
const P=(a,mn,mx,c)=>`<polyline fill="none" stroke="${c}" stroke-width="2" points="${a.map((v,i)=>(6+i*(288/(a.length-1))).toFixed(1)+','+(74-(v-mn)/(mx-mn||1)*68).toFixed(1)).join(' ')}"/>`;
const PN={w:5,m:20,q:60};let ps=null;
const CH={};
function chart(id,n,h,body,circ,txt){CH[id]={n,circ,txt};
return `<p class="rd" id="rd-${id}"></p><svg data-c="${id}" viewBox="0 0 300 ${h}" width="100%" style="background:#F7F9FB;border-radius:8px">${body}<line id="ml-${id}" y1="6" y2="74" stroke="#22313F" stroke-dasharray="2 2"/>${circ.map(c=>`<circle class="mc-${id}" r="4" fill="#fff" stroke="${c.col}" stroke-width="2"/>`).join('')}<text x="6" y="91" font-size="9" fill="#6B7885">${dl(n-1,1)}</text><text x="294" y="91" font-size="9" text-anchor="end" fill="#6B7885">${dl(0,1)}</text></svg>`}
function mark(id,i){const c=CH[id],x=6+i*288/(c.n-1),l=$('#ml-'+id);l.setAttribute('x1',x);l.setAttribute('x2',x);
document.querySelectorAll('.mc-'+id).forEach((e,j)=>{e.setAttribute('cx',x);e.setAttribute('cy',c.circ[j].y[i])});
$('#rd-'+id).innerHTML=c.txt(i)}
function c2(k){const n=PN[k],pr=ps.ft.px.slice(-n),b=pr[0],a=pr.map(v=>(v/b-1)*100),mn=Math.min(...a),mx=Math.max(...a),col=a[n-1]>=0?'var(--up)':'var(--dn)';
return chart('c2',n,96,P(a,mn,mx,col),[{col,y:a.map(v=>74-(v-mn)/(mx-mn||1)*68)}],i=>`${dl(n-1-i)}　收盤 ${pr[i].toLocaleString()} 元　<span class="${a[i]>=0?'u':'d'}">較區間起點 ${SG(a[i])}%</span>`)+'<p class="note">移動滑鼠或手指，查看每天的日期與收盤價</p>'}
function set2(k){$('#c2').innerHTML=c2(k);mark('c2',CH.c2.n-1)}
function hv(e){const sv=e.target.closest&&e.target.closest('svg[data-c]');if(!sv)return;const id=sv.dataset.c,c=CH[id],r=sv.getBoundingClientRect();mark(id,Math.max(0,Math.min(c.n-1,Math.round(((e.clientX-r.left)/r.width*300-6)/(288/(c.n-1))))))}
const TB=(t,rows)=>{const s=[0,1,2].map(j=>rows.reduce((q,r)=>q+r[j],0)),N=v=>v.toLocaleString(),nf=v=>(v>0?'+':'')+N(v),cl=v=>v>0?'u':v<0?'d':'',D=[4,3,2,1,0].map(k=>dl(k,1));
return `<div class="ch"><h4>${t}近 5 日買賣張數（張）</h4><table class="mini"><thead><tr><th></th><th>買進</th><th>賣出</th><th>買賣超</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${D[i]}</td><td>${N(r[0])}</td><td>${N(r[1])}</td><td class="${cl(r[2])}">${nf(r[2])}</td></tr>`).join('')}<tr><td><b>合計</b></td><td>${N(s[0])}</td><td>${N(s[1])}</td><td class="${cl(s[2])}"><b>${nf(s[2])}</b></td></tr></tbody></table></div>`};
function openP(i){const x=cur[i],f=x.ft;ps=x;
const bar=(l,v,c)=>`<div class="bar"><span>${l}</span><div><i style="width:${v}%;background:${c}"></i></div><b>${F(v)}</b></div>`;
let h=`<h3>${x.c} ${x.n}</h3>`+bar('上漲訊號機率',x.u,'var(--up)')+bar('盤整機率',x.f,'var(--fl)')+bar('下跌機率',x.d,'var(--dn)');
if(f){const fo=f.fo.slice(-20),tr=f.tr.slice(-20),vo=f.vo.slice(-20),pr=f.px.slice(-20),mv=Math.max(...vo,1.5),a=fo.concat(tr),mn=Math.min(...a),mx=Math.max(...a),yy=v=>74-(v-mn)/(mx-mn||1)*68,px=i=>pr[i].toLocaleString();
h+=`<div class="ch"><h4>標準化收盤價走勢（相較區間第 1 天）</h4><div class="tabs">${[['w','週'],['m','月'],['q','季']].map(([k,l])=>`<button class="tb${k=='m'?' on':''}" data-k="${k}">${l}</button>`).join('')}</div><div id="c2"></div></div>`
+`<div class="ch"><h4>日成交量倍數（相對 20 日均量）</h4>${chart('c3',20,96,vo.map((v,k)=>`<rect x="${1+k*288/19}" y="${74-v/mv*68}" width="10" height="${v/mv*68}" fill="var(--ac)"/>`).join('')+`<line x1="0" x2="300" y1="${74-1/mv*68}" y2="${74-1/mv*68}" stroke="#22313F" stroke-dasharray="3 3"/>`,[],i=>`${dl(19-i)}　收盤 ${px(i)} 元　成交量 ${vo[i].toFixed(2)} 倍`)}</div>`
+`<div class="ch"><h4>外資（藍）／投信（橘）買賣超佔比走勢（%）</h4><p class="note" style="margin:0 0 4px">當日收盤價：<b style="color:var(--ink);font-size:15px">${f.px[59].toFixed(1)} 元</b></p>${chart('c4',20,96,P(fo,mn,mx,'#4A90C2')+P(tr,mn,mx,'#E0912F'),[{col:'#4A90C2',y:fo.map(yy)},{col:'#E0912F',y:tr.map(yy)}],i=>`${dl(19-i)}　收盤 ${px(i)} 元<br><span style="color:#4A90C2;white-space:nowrap">外資 ${SG(fo[i])}%</span>　<span style="color:#E0912F;white-space:nowrap">投信 ${SG(tr[i])}%</span>`)}</div>`
+TB('外資',f.fl)+TB('投信',f.tl)+`<p class="note">資料來源：FinMind（台灣證交所公開資料），資料日期 ${sel()}。買超紅、賣超綠。</p>`}
else h+='<p class="note">模擬情境沒有對應的特徵資料，因此只顯示機率。</p>';
$('#pb').innerHTML=h;if(f){set2('m');mark('c3',19);mark('c4',19)}document.body.classList.add('op')}
function closeP(){document.body.classList.remove('op')}
$('#rep').addEventListener('click',e=>{const r=e.target.closest('tr[data-i]');if(r)openP(+r.dataset.i)});
$('#rep').addEventListener('keydown',e=>{const r=e.target.closest('tr[data-i]');if(r&&e.key==='Enter')openP(+r.dataset.i)});
$('#ov').onclick=$('#x').onclick=closeP;
$('#pb').addEventListener('click',e=>{const b=e.target.closest('.tb');if(!b)return;document.querySelectorAll('.tb').forEach(t=>t.classList.toggle('on',t===b));set2(b.dataset.k)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeP()});
$('#sc').onchange=$('#th').oninput=render;
$('#rep').addEventListener('click',e=>{const t=e.target;if(t.classList.contains('dti')){try{t.showPicker()}catch(_){}}else if(t.classList.contains('dtx')){DT='';render()}});
$('#rep').addEventListener('change',e=>{if(e.target.classList.contains('dti')){DT=e.target.value;render()}});
$('#pb').addEventListener('pointermove',hv);$('#pb').addEventListener('pointerdown',hv);
$('#dc').addEventListener('click',e=>{const b=e.target.closest('button[data-j]');if(b){SELJ=+b.dataset.j;render()}});
info();
render();
try{fetch('real_data.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(J=>{if(J&&J.stocks&&J.model&&J.dates&&J.asof>=RD.asof){RD=J;SRC='自動更新檔（real_data.json）';loadData();info();render()}}).catch(()=>{})}catch(_){}
</script>
